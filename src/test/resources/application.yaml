spring:
  datasource:
    url: jdbc:h2:mem:backend_api_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  issuer: backend-api-server-test
  secret: test-jwt-secret-must-be-longer-than-32bytes
  access-token-expiration-seconds: 900
  refresh-token-expiration-seconds: 1209600
