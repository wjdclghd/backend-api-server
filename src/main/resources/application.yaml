spring:
  application:
    name: backend-api-server

  profiles:
    default: local

  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,X-Requested-With}
    max-age-seconds: ${CORS_MAX_AGE_SECONDS:3600}

rate-limit:
  signup:
    ip-capacity: ${SIGNUP_IP_RATE_LIMIT_CAPACITY:10}
    ip-window-seconds: ${SIGNUP_IP_RATE_LIMIT_WINDOW_SECONDS:60}
    key-capacity: ${SIGNUP_EMAIL_RATE_LIMIT_CAPACITY:3}
    key-window-seconds: ${SIGNUP_EMAIL_RATE_LIMIT_WINDOW_SECONDS:3600}
