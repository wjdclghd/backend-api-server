spring:
  application:
    name: backend-api-server

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/backend_api}
    username: ${DB_USERNAME:backend_user}
    password: ${DB_PASSWORD:backend_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

jwt:
  issuer: ${JWT_ISSUER:backend-api-server}
  secret: ${JWT_SECRET:local-development-jwt-secret-must-be-changed-32bytes}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:900}
  refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}
